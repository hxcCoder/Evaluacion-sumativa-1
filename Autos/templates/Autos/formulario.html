{% extends 'core/base.html' %}

{% block contenido %}
    <h2>Agregar Nuevo Vehículo</h2>
    
    <form method="post">
        {% csrf_token %}
        
        <!-- form.as_p imprime los campos del formulario ordenados en párrafos -->
        {{ form.as_p }}
        
        <button type="submit">Guardar Auto</button>
    </form>
    
    <br>
    <a href="{% url 'catalogo_autos' %}">Volver al catálogo</a>
{% endblock %}
